services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clubit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clubit}
      POSTGRES_DB: clubit
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - clubit_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clubit -d clubit"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://clubit:${POSTGRES_PASSWORD:-clubit}@db:5432/clubit?schema=public
      # Require real secrets — no weak defaults (boot fails in production without them)
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 chars, not a placeholder)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env (min 32 chars)}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:4321,http://127.0.0.1:4321}
      # Cookies set for same-origin via nginx; CORS still needed for direct API hits
      THROTTLE_TTL: ${THROTTLE_TTL:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-ITCLUB <noreply@clubit.local>}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    ports:
      - "${API_PORT:-3000}:3000"

  web:
    build:
      context: ./web
      args:
        # Relative URL — nginx proxies /api → api container (cookies same-origin)
        PUBLIC_API_URL: ${PUBLIC_API_URL:-/api/v1}
        PUBLIC_TURNSTILE_SITE_KEY: ${PUBLIC_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  clubit_pg:
